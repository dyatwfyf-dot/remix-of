name: Build Android APK

# يشتغل تلقائياً عند أي push لفرع main، وأيضاً يدوياً من تبويب Actions بالضغط على "Run workflow"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: استنساخ الكود
        uses: actions/checkout@v4

      - name: تثبيت pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: تثبيت Java (مطلوب لـ Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت حزم المشروع
        run: pnpm install --frozen-lockfile

      - name: بناء نسخة الويب الخاصة بـ Capacitor
        run: pnpm run build:android:web

      - name: مزامنة Capacitor مع مشروع Android
        run: npx cap sync android

      - name: منح صلاحية التنفيذ لـ gradlew
        run: chmod +x android/gradlew

      - name: بناء APK (release)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: رفع ملف APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          # اسم الملف الناتج من Gradle قد يختلف قليلاً حسب إعدادات التوقيع؛
          # هذا المسار الافتراضي لبناء release بدون توقيع مخصص
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
