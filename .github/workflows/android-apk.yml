name: Build Mizan Android APK

# APK builds are paused temporarily. Keep manual dispatch available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Type-check application
        run: npx tsc --noEmit --pretty false

      - name: Build installable APK
        run: npm run build:android:debug

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/Mizan-Android.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Mizan-Android-APK
          path: artifacts/Mizan-Android.apk
          if-no-files-found: error
          retention-days: 90
