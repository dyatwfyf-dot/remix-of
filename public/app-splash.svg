 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#78b5eb"/><stop offset=".48" stop-color="#f7f2e9"/><stop offset="1" stop-color="#d6e6ef"/></linearGradient>
